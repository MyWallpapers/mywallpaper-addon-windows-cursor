[package]
name = "mywallpaper-windows-cursor-companion"
version = "1.0.5"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "backend"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }
